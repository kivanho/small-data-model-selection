name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: "Also run the full benchmark preset (about 15-20 min on 2 cores) and upload its artifacts"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Smoke experiment (fails on non-finite values or incomplete coverage)
        run: PYTHONPATH=src python -m smalldata.run --preset smoke --out results/runs/ci-smoke --n-jobs 2
      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: results/runs/ci-smoke

  full-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.full_benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Full benchmark (all targets, families, baselines, complete procedure, 3 protocols, 5 seeds)
        run: PYTHONPATH=src python -m smalldata.run --preset benchmark --out results/runs/ci-benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-run
          path: results/runs/ci-benchmark
